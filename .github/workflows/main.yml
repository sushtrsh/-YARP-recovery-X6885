name: TWRP Recovery Build A16

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL'
        required: true
        default: 'https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-16.0'
      RECOVERY_REPO_URL:
        description: 'URL Repo bootable/recovery (fork repo kamu)'
        required: true
        default: 'https://github.com/sushtrsh/android_bootable_recovery'
      RECOVERY_REPO_BRANCH:
        description: 'Branch bootable/recovery'
        required: true
        default: 'twrp-16.0'
      RECOVERY_COMMIT:
        description: 'Pin commit bootable/recovery (HEAD = commit terbaru, custom = isi SHA)'
        required: true
        default: 'HEAD'
        type: choice
        options:
          - HEAD
          - custom
      RECOVERY_COMMIT_CUSTOM:
        description: 'SHA custom bootable/recovery (dipakai kalau pilih custom)'
        required: false
        default: ''
      BUILD_COMMIT:
        description: 'Pin build/make (HEAD = tanpa pin, custom = isi SHA di bawah)'
        required: true
        default: '6262fe1107564663434ec257d275bc0f9573b976'
        type: choice
        options:
          - '6262fe1107564663434ec257d275bc0f9573b976'
          - HEAD
          - custom
      BUILD_COMMIT_CUSTOM:
        description: 'SHA custom build/make (dipakai kalau pilih custom)'
        required: false
        default: ''
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/sushtrsh/-YARP-recovery-X6885'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'test_X6885'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/infinix/X6885'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'X6885'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME (lunch: <MAKEFILE_NAME>-bp2a-eng or <MAKEFILE_NAME>)'
        required: true
        default: 'twrp_X6885'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'vendorboot'
      USE_CCACHE:
        description: 'Use ccache (restore + save)'
        required: true
        default: 'true'
        type: choice
        options:
          - true
          - false

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Initialize workspace
      run: |
        mkdir -p workspace/twrp
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: Prepare the build environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses6 libncurses-dev x11proto-core-dev libx11-dev \
            libgl1-mesa-dev libxml2 libxml2-utils xsltproc unzip fontconfig \
            patch aria2 python3 python-is-python3 ccache rsync bc
        mkdir -p ~/bin
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup SSH Keys
      if: ${{ startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@github.com') }}
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: |
          ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Sync TWRP sources
      env:
        RECOVERY_URL: ${{ github.event.inputs.RECOVERY_REPO_URL }}
        RECOVERY_BRANCH: ${{ github.event.inputs.RECOVERY_REPO_BRANCH }}
        RECOVERY_SHA: ${{ github.event.inputs.RECOVERY_COMMIT }}
        RECOVERY_CUSTOM: ${{ github.event.inputs.RECOVERY_COMMIT_CUSTOM }}
        BUILD_SHA: ${{ github.event.inputs.BUILD_COMMIT }}
        BUILD_CUSTOM: ${{ github.event.inputs.BUILD_COMMIT_CUSTOM }}
      run: |
        [ "$RECOVERY_SHA" = "HEAD" ] && RECOVERY_SHA=""
        [ "$BUILD_SHA" = "HEAD" ] && BUILD_SHA=""
        [ "$RECOVERY_SHA" = "custom" ] && RECOVERY_SHA="$RECOVERY_CUSTOM"
        [ "$BUILD_SHA" = "custom" ] && BUILD_SHA="$BUILD_CUSTOM"
        cd twrp
        ~/bin/repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
        if [ -n "$BUILD_SHA" ]; then
          mkdir -p .repo/local_manifests
          {
            echo '<manifest>'
            echo "  <extend-project name=\"android_build\" path=\"build/make\" revision=\"$BUILD_SHA\" upstream=\"twrp-16.0\" />"
            echo '</manifest>'
          } > .repo/local_manifests/pin.xml
          cat .repo/local_manifests/pin.xml
        fi
        ~/bin/repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune

        echo "==> Mengganti bootable/recovery dengan fork repo: $RECOVERY_URL (branch: $RECOVERY_BRANCH)"
        rm -rf bootable/recovery
        git clone "$RECOVERY_URL" -b "$RECOVERY_BRANCH" bootable/recovery
        if [ -n "$RECOVERY_SHA" ]; then
          echo "==> Checkout commit spesifik: $RECOVERY_SHA"
          git -C bootable/recovery checkout "$RECOVERY_SHA"
        fi
        echo "==> Info commit bootable/recovery:"
        git -C bootable/recovery log -1 --oneline
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone device tree
      run: |
        cd twrp
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Workaround for missing repo projects
      run: |
        cd twrp
        ~/bin/repo sync external/gflags || true
        ~/bin/repo sync external/guava || true
        ~/bin/repo sync hardware/google/interfaces || true
        ~/bin/repo sync hardware/google/pixel || true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Restore ccache
      if: github.event.inputs.USE_CCACHE == 'true'
      id: ccache
      uses: actions/cache/restore@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-twrp-ccache-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.event.inputs.DEVICE_TREE_BRANCH }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-twrp-ccache-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.event.inputs.DEVICE_TREE_BRANCH }}-
          ${{ runner.os }}-twrp-ccache-${{ github.event.inputs.MANIFEST_BRANCH }}-

    - name: Configure ccache
      if: github.event.inputs.USE_CCACHE == 'true'
      run: |
        mkdir -p "$HOME/.ccache"
        echo "USE_CCACHE=1" >> "$GITHUB_ENV"
        echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
        echo "CCACHE_EXEC=$(command -v ccache)" >> "$GITHUB_ENV"
        ccache -M 10G
        ccache -z
        echo "Cache hit: ${{ steps.ccache.outputs.cache-hit }}"
        ccache -s

    - name: Building recovery
      id: build
      run: |
        cd twrp
        git -C bootable/recovery log -1 --format='BUILD pakai bootable/recovery: %H %cd'
        git -C build/make log -1 --format='BUILD pakai build/make: %H %cd'
        set +e
        source build/envsetup.sh
        source ${{ github.event.inputs.DEVICE_PATH }}/vendorsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-bp2a-eng || lunch ${{ github.event.inputs.MAKEFILE_NAME }}
        make clean
        mka adbd ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      continue-on-error: true

    - name: Upload Patch Debug (jika ada patch gagal)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: patch-debug-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        path: |
          ${{ steps.pwd.outputs.workspace-folder }}/twrp/patch_debug
          ${{ steps.pwd.outputs.workspace-folder }}/patch_debug
        if-no-files-found: ignore

    - name: Show ccache statistics
      if: always() && github.event.inputs.USE_CCACHE == 'true'
      run: |
        ccache -s
        du -sh "$HOME/.ccache" 2>/dev/null || true

    - name: Save ccache
      if: always() && github.event.inputs.USE_CCACHE == 'true' && steps.ccache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.ccache
        key: ${{ steps.ccache.outputs.cache-primary-key }}

    - name: Ukuran ramdisk
      if: always()
      run: |
        cd twrp
        P=out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        ls -l $P/obj/PACKAGING/*/*.cpio.gz $P/vendor-bootconfig.img 2>/dev/null || true
        du -sh $P/vendor_ramdisk $P/recovery/root 2>/dev/null || true
        du -ah $P/recovery/root 2>/dev/null | sort -rh | head -30 || true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Check output files
      if: ${{ !cancelled() }}
      run: |
        cd twrp
        P="out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
        ls -al out/target/product/ || true
        echo "--- Target Device out dir ---"
        ls -al "$P" || true
        mkdir -p "${{ steps.pwd.outputs.workspace-folder }}/artifacts"

        if [ -f "$P/vendor_boot.img" ]; then
          cp "$P/vendor_boot.img" "${{ steps.pwd.outputs.workspace-folder }}/artifacts/YARP-16.0-Unofficial-X6885.img"
        elif [ -f "$P/vendorboot.img" ]; then
          cp "$P/vendorboot.img" "${{ steps.pwd.outputs.workspace-folder }}/artifacts/YARP-16.0-Unofficial-X6885.img"
        fi

        find "$P" -maxdepth 1 -type f -name "*.zip" -exec cp {} "${{ steps.pwd.outputs.workspace-folder }}/artifacts/" \;

        # Pastikan ramdisk dan vendor-bootconfig tidak masuk release
        rm -f "${{ steps.pwd.outputs.workspace-folder }}/artifacts/"*ramdisk*
        rm -f "${{ steps.pwd.outputs.workspace-folder }}/artifacts/"*bootconfig*

        cd "${{ steps.pwd.outputs.workspace-folder }}/artifacts"
        if [ -f "YARP-16.0-Unofficial-X6885.img" ]; then
          sha256sum "YARP-16.0-Unofficial-X6885.img" > "YARP-16.0-Unofficial-X6885.img.sha256"
        fi

        echo "--- Final Artifacts for Release ---"
        ls -lah
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload to Release
      id: release
      if: ${{ !cancelled() }}
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/artifacts/*
        name: YARP-16.0-Unofficial-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Recovery pin: ${{ github.event.inputs.RECOVERY_COMMIT || 'HEAD' }}
          Build pin: ${{ github.event.inputs.BUILD_COMMIT || 'HEAD' }}
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}
          Build Status: ${{ steps.build.outcome }}
          Output: YARP-16.0-Unofficial-X6885.img
          Tested on 16.3.0155SP15
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Kirim notifikasi ke Telegram
      if: always()
      env:
        TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        BUILD_STATUS: ${{ steps.build.outcome }}
        RELEASE_STATUS: ${{ steps.release.outcome }}
        RELEASE_URL: ${{ steps.release.outputs.url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        DEVICE: ${{ github.event.inputs.DEVICE_NAME }}
        MANIFEST: ${{ github.event.inputs.MANIFEST_BRANCH }}
        TARGET: ${{ github.event.inputs.BUILD_TARGET }}
      run: |
        if [ "$BUILD_STATUS" = "success" ] && [ "$RELEASE_STATUS" = "success" ]; then
          TEXT=$(printf '✅ Build YARP selesai\nDevice: %s\nManifest: %s\nTarget: %s\nRelease: %s' \
            "$DEVICE" "$MANIFEST" "$TARGET" "$RELEASE_URL")
        else
          TEXT=$(printf '❌ Build YARP gagal\nDevice: %s\nLog: %s' "$DEVICE" "$RUN_URL")
        fi
        curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${CHAT_ID}" \
          --data-urlencode "text=${TEXT}"
